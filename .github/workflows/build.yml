name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Developer Mode (pdfrx needs symlink support)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: cmd
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: |
          Copy-Item pubspec.yaml pubspec.backup.yaml
          Copy-Item lib lib.backup -Recurse
          Copy-Item test test.backup -Recurse
          flutter create --platforms=windows --project-name papyra --org com.papyra .
          Copy-Item pubspec.backup.yaml pubspec.yaml -Force
          Remove-Item lib,test -Recurse -Force
          Copy-Item lib.backup lib -Recurse
          Copy-Item test.backup test -Recurse
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: papyra-windows
          path: build/windows/x64/runner/Release/**

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Generate platform scaffolding
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          cp -r lib lib.backup
          cp -r test test.backup
          flutter create --platforms=android --project-name papyra --org com.papyra .
          cp pubspec.backup.yaml pubspec.yaml
          rm -rf lib test
          mv lib.backup lib
          mv test.backup test
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          # Ensure compileSdk is set if not already
          if ! grep -q 'compileSdk = 36' android/app/build.gradle.kts; then
            sed -i '/android {/a\    compileSdk = 36' android/app/build.gradle.kts
          fi
          # Override flutter.compileSdkVersion for plugins
          echo "flutter.compileSdkVersion=36" > android/local.properties
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
      - name: Add PDF intent filter to AndroidManifest.xml
        run: |
          cat > /tmp/intent_filter.sed << 'SEDEOF'
/<activity /a\
            <intent-filter>\
                <action android:name="android.intent.action.VIEW" />\
                <category android:name="android.intent.category.DEFAULT" />\
                <category android:name="android.intent.category.BROWSABLE" />\
                <data android:mimeType="application/pdf" />\
                <data android:scheme="content" />\
                <data android:scheme="file" />\
            </intent-filter>
SEDEOF
          sed -i -f /tmp/intent_filter.sed android/app/src/main/AndroidManifest.xml
      - run: flutter clean
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: papyra-android
          path: build/app/outputs/flutter-apk/*.apk

  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: papyra-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: papyra-windows
          path: dist/papyra-windows
      - run: |
          cd dist
          zip -qr papyra-windows.zip papyra-windows
          rm -rf papyra-windows
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true