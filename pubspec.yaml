name: papyra
description: "Papyra - open-source PDF platform for Windows and Android."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^3.1.0
  pdfrx_engine: ^3.1.0
  pdf: ^3.10.8
  image: ^4.2.0
  file_picker: ^8.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  windows: true
  image_path: assets/icon/icon.png
  min_sdk_android: 24